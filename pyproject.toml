[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ar-reconciliation-agent"
version = "1.0.0"
description = "Deterministic AR cash application engine with a human-in-the-loop AI exception agent."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# Only needed for the LLM backend (--backend llm). The rules backend and the
# deterministic engine do not import it.
llm = ["openai>=1.0"]
# Optional. The project reads .env with a built-in parser when this is not
# installed, so it is a convenience rather than a requirement.
dotenv = ["python-dotenv>=1.0"]
dev = ["pytest>=8.0"]
# Reading PDF supporting documents (contracts, remittance advice).
evidence = ["pypdf>=4.0"]
# The single-page review UI (app/review_app.py).
ui = ["streamlit>=1.30"]

[project.scripts]
ar-reconcile = "ar_reconciliation.cli:reconcile_main"
ar-agent = "ar_reconciliation.cli:agent_main"
ar-evidence = "ar_reconciliation.cli:evidence_main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --strict-markers"
filterwarnings = [
    "error::DeprecationWarning:ar_reconciliation",
]
